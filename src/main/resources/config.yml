# TownityPlayerLimit – live-reloadable via /playerlimit reload

# Maximum players allowed on the proxy
max-players: 100

# If false, bypass players do not consume a slot toward the cap
bypass-counts-as-slot: false

# Permission that allows joining when the proxy is full
bypass-permission: townity.playerlimit.bypass

# Show the configured max-players in the server list ping
update-ping-max-players: true

# Chat-Prefix (mit Pfeil) | Disconnect-Titel (ohne Pfeil, eigene Zeile)
prefix: "&6&lTOWNITY.DE &7⇒ "
disconnect-prefix: "&6&lTOWNITY.DE"

messages:
  # Wichtige Wörter: &6 | Rest: &7 | Prefix wird automatisch vorangestellt
  full: "&7Der Server ist aktuell &6voll&7! &7(&6%online%&7/&6%max%&7)"
  reload-success: "&7Die Config wurde &6erfolgreich &7neu geladen&7. &7Max: &6%max%"
  reload-failed: "&7Der Reload ist &6fehlgeschlagen&7. Siehe Konsole."
  no-permission: "&7Dazu hast du &6keine Berechtigung&7."
  usage: "&7Verwendung: &6/playerlimit reload &7| &6/wartung"

motd:
  enabled: true
  # auto | minimessage | legacy
  format: auto
  file: ""
  lines:
    - "&6■■■■■■■■■■■■ &e✦ &6TOWNITY.DE &e✦ &6■■■■■■■■■■■■"
    - "&6       ⚙ &6ᴄɪᴛʏʙᴜɪʟᴅ &e• &6ᴇᴠᴇɴᴛꜱ &e• &6ᴄᴏᴍᴍᴜɴɪᴛʏ ⚙"

# Wartung – Status in maintenance-state.yml (überlebt Restarts)
maintenance:
  bypass-permission: townity.wartungssystem.bypass
  kick-on-enable: true
  block-join: true
  motd:
    enabled: true
    format: auto
    lines:
      - "&6■■■■■■■■■■■■ &e✦ &6TOWNITY.DE &e✦ &6■■■■■■■■■■■■"
      - "&6          ⚙ &6ᴡᴀʀᴛᴜɴɢ &e• &6ʙᴀʟᴅ &e• &6ᴢᴜʀüᴄᴋ ⚙"
  messages:
    network-kick: "&7Das Netzwerk ist derzeit in &6Wartung&7."
    server-kick: "&7Der Server &6%server% &7ist in &6Wartung&7."
    network-denied: "&7Das Netzwerk ist derzeit in &6Wartung&7."
    server-denied: "&7Du kannst &6%server% &7gerade nicht betreten (&6Wartung&7)."
    enabled: "&7Netzwerk-Wartung wurde &6aktiviert&7."
    disabled: "&7Netzwerk-Wartung wurde &6deaktiviert&7."
    server-enabled: "&7Wartung für &6%server% &7wurde &6aktiviert&7."
    server-disabled: "&7Wartung für &6%server% &7wurde &6deaktiviert&7."
    status: "&7Netzwerk: &6%network% &7| Server: &6%servers%"
    unknown-server: "&7Unbekannter Server: &6%server%"
    usage: "&7Verwendung: &6/wartung &7| &6an&7/&6aus &7| &6server <name> <an|aus> &7| &6status"
